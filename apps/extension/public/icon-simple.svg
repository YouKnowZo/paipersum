<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Simple version for smaller sizes -->
  <defs>
    <linearGradient id="bg-simple" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F5A623"/>
      <stop offset="1" stop-color="#1E3A5F"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg-simple)"/>
  
  <!-- Simple P -->
  <g transform="translate(30, 25)">
    <!-- P stem and bowl -->
    <path d="M20 15 L20 90 M20 15 C20 15, 50 10, 60 25 C70 38, 65 50, 55 58 C40 68, 20 60, 20 60" 
          stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Orange accent -->
    <circle cx="45" cy="30" r="18" fill="#F5A623" opacity="0.5"/>
    
    <!-- White dot -->
    <circle cx="20" cy="75" r="10" fill="white"/>
  </g>
</svg>
