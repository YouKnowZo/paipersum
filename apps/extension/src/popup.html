<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaiperSum</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    
    .logo {
      width: 24px;
      height: 24px;
      background: #0f4c81;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 12px;
    }
    
    .title {
      font-weight: 600;
      color: #1f2937;
    }
    
    .section {
      margin-bottom: 16px;
    }
    
    .section-title {
      font-weight: 500;
      color: #374151;
      margin-bottom: 8px;
    }
    
    .button {
      width: 100%;
      padding: 8px 12px;
      background: #0f4c81;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .button:hover {
      background: #0a3d6b;
    }
    
    .button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    
    .input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 8px;
    }
    
    .input:focus {
      outline: none;
      border-color: #0f4c81;
      box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.1);
    }
    
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    
    .status.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    
    .status.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    
    .footer {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
      font-size: 12px;
      color: #6b7280;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">PS</div>
    <div class="title">PaiperSum</div>
  </div>
  
  <div class="section">
    <div class="section-title">API Configuration</div>
    <input type="url" id="api-url" class="input" placeholder="http://localhost:8000">
    <button id="save-config" class="button">Save Configuration</button>
    <div id="config-status" class="status" style="display: none;"></div>
  </div>
  
  <div class="section">
    <div class="section-title">Quick Actions</div>
    <button id="analyze-current" class="button">Analyze Current Page</button>
    <button id="open-dashboard" class="button">Open Dashboard</button>
  </div>
  
  <div class="footer">
    Not legal advice. AI-powered analysis for informational purposes only.
  </div>

  <script src="popup.js"></script>
</body>
</html>
