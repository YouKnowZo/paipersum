    <style>
        :root {
            /* Light Theme Color Palette */
            --body-bg: #F8F9FA; /* Off-white for main background */
            --surface-bg: #FFFFFF; /* Pure white for cards, modals, dropdowns */
            --section-bg-alt: #F1F3F5; /* Slightly darker off-white for alternating sections */
            
            --text-primary: #212529; /* Near black for primary text */
            --text-secondary: #495057; /* Dark gray for secondary text */
            --text-muted: #6C757D; /* Medium gray for less important text, placeholders */
            --text-on-accent: #FFFFFF; /* White text on accent backgrounds */

            --accent-primary: #007BFF; /* A refined, modern blue */
            --accent-primary-hover: #0056b3; /* Darker blue for hover */
            --accent-primary-light: #E0F2FF; /* Light tint of accent for backgrounds */
            --accent-primary-glow: rgba(0, 123, 255, 0.15); /* Subtle glow for focus/hovers */
            --accent-primary-dark: #004085; /* Darker shade for logo gradient */


            --accent-secondary: #17A2B8; /* A sophisticated teal */
            --accent-secondary-hover: #117A8B;
            --accent-secondary-glow: rgba(23, 162, 184, 0.15);

            --border-color-soft: #E9ECEF; /* Light gray for subtle borders */
            --border-color-strong: #CED4DA; /* Stronger gray for input borders, etc. */

            --success: #28A745;
            --warning: #FFC107; /* Brighter yellow */
            --danger: #DC3545;
            --info: #17A2B8; /* Using accent secondary for info */

            --text-success: var(--success);
            --text-warning: #c69500; /* Darker yellow text for better contrast on light bg */
            --text-danger: var(--danger);
            --text-info: var(--info);
            --text-accent-primary: var(--accent-primary);
            --text-purple-400: #6f42c1; /* A distinct purple for specific tags */

            /* Backgrounds for specific elements, e.g., feature icons */
            --bg-accent-primary: var(--accent-primary);
            --bg-success: var(--success);
            --bg-danger: var(--danger);
            --bg-info: var(--info);
            --bg-purple-500: #6f42c1;
            --bg-warning: var(--warning);


            /* Typography */
            --font-body: 'Inter', sans-serif;
            --font-heading: 'Space Grotesk', sans-serif;
            --font-brand: 'Figtree', sans-serif; /* New brand font */

            /* Shadows - subtle for light theme */
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 8px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 20px rgba(0,0,0,0.07), 0 3px 6px rgba(0,0,0,0.05);

             /* Animations */
            --transition-duration: 0.3s;
            --transition-easing: cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px; /* Base font size */
        }

        body {
            font-family: var(--font-body);
            background-color: var(--body-bg);
            color: var(--text-primary);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden; /* Prevent horizontal scroll */
        }
        
        /* Subtle background pattern */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="none" fill-rule="evenodd"%3E%3Cg fill="%23E9ECEF" fill-opacity="0.4"%3E%3Cpath d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');
            opacity: 0.3;
            z-index: -1;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading);
            letter-spacing: -0.03em;
            color: var(--text-primary); /* Ensure headings use primary text color */
        }
        h1 { font-size: 2.75rem; line-height: 1.2; font-weight: 700; margin-bottom: 1rem;} /* 44px */
        h2 { font-size: 2.25rem; line-height: 1.25; font-weight: 600; margin-bottom: 0.75rem;} /* 36px */
        h3 { font-size: 1.75rem; line-height: 1.3; font-weight: 600; margin-bottom: 0.5rem;} /* 28px */
        h4 { font-size: 1.25rem; line-height: 1.4; font-weight: 600; margin-bottom: 0.25rem;} /* 20px */
        
        p { color: var(--text-secondary); margin-bottom: 1rem; }

        .brand-name {
            font-family: var(--font-brand);
            font-weight: 700; /* Bolder brand name */
            font-size: 1.5rem; /* Slightly larger */
            color: var(--text-primary);
        }
        
        /* Hero brand name shimmer */
        .hero-section .brand-name {
            background-image: linear-gradient(
                -75deg,
                var(--accent-primary-dark) 20%,
                var(--accent-primary) 40%,
                var(--accent-primary-dark) 60%,
                var(--accent-primary) 80%
            );
            background-size: 300% auto;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: textShimmer 5s linear infinite;
        }
        @keyframes textShimmer {
            to { background-position: -300% center; }
        }


        .nav-header {
            background-color: rgba(255, 255, 255, 0.85); /* surface-bg with alpha */
            backdrop-filter: blur(10px) saturate(180%);
            border-bottom: 1px solid var(--border-color-soft);
            box-shadow: var(--shadow-sm);
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform var(--transition-duration) var(--transition-easing);
        }
        .logo-container svg {
            width: 100%;
            height: 100%;
            color: var(--accent-primary); 
        }
        .logo-container:hover {
            transform: scale(1.05);
        }
        /* Hero logo subtle breathing shadow */
        .hero-section .logo-container {
             animation: logoBreathe 3s ease-in-out infinite alternate;
        }
        @keyframes logoBreathe {
            0% { filter: drop-shadow(0 0 3px var(--accent-primary-glow)); }
            100% { filter: drop-shadow(0 0 8px var(--accent-primary-glow)); }
        }


        .card {
            background-color: var(--surface-bg);
            border-radius: 0.75rem; 
            border: 1px solid var(--border-color-soft);
            box-shadow: var(--shadow-md);
            transition: transform var(--transition-duration) var(--transition-easing), 
                        box-shadow var(--transition-duration) var(--transition-easing), 
                        border-color var(--transition-duration) var(--transition-easing);
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg), 0 0 0 1px var(--accent-primary-glow); /* Added subtle border glow */
            border-color: var(--accent-primary);
        }
        .feature-card .icon-wrapper {
             transition: transform var(--transition-duration) var(--transition-easing), 
                         box-shadow var(--transition-duration) var(--transition-easing),
                         background-color var(--transition-duration) var(--transition-easing);
        }
        .feature-card:hover .icon-wrapper {
             transform: scale(1.1) translateY(-3px) rotate(-3deg);
             box-shadow: 0 8px 20px rgba(0,123,255,0.25); /* More prominent glow for feature icons */
        }


        .hero-title-accent {
            color: var(--accent-primary); 
            text-shadow: 1px 1px 3px rgba(0, 123, 255, 0.15); 
        }

        .btn {
            padding: 0.75rem 1.5rem; 
            border-radius: 0.375rem; 
            font-weight: 600;
            font-family: var(--font-heading);
            transition: all var(--transition-duration) var(--transition-easing);
            text-align: center;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid transparent;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: var(--shadow-sm);
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02); /* Added subtle scale */
            box-shadow: var(--shadow-lg);
        }
        .btn:active:not(:disabled) {
            transform: translateY(0px) scale(0.98); /* Added active state */
             box-shadow: var(--shadow-sm);
        }
        .btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-primary {
            background-color: var(--accent-primary);
            color: var(--text-on-accent);
            border-color: var(--accent-primary);
        }
        .btn-primary:hover:not(:disabled) {
            background-color: var(--accent-primary-hover);
            border-color: var(--accent-primary-hover);
        }
        .btn-secondary {
            background-color: transparent;
            color: var(--accent-primary);
            border-color: var(--accent-primary);
        }
        .btn-secondary:hover:not(:disabled) {
            background-color: var(--accent-primary-light);
            color: var(--accent-primary-hover);
            border-color: var(--accent-primary-hover);
        }
        
        .btn-cta-pulse { 
            animation: pulse-shadow-soft 2.5s infinite;
        }
        @keyframes pulse-shadow-soft { /* Softer shadow pulse */
            0% { box-shadow: 0 0 0 0 rgba(0, 123, 255, 0.2); }
            70% { box-shadow: 0 0 0 10px rgba(0, 123, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 123, 255, 0); }
        }
        .btn-cta-pulse:hover:not(:disabled) {
             animation-play-state: paused;
        }

        .animated-underline {
          position: relative;
          text-decoration: none;
          padding-bottom: 5px; 
          color: var(--text-secondary);
        }
        .animated-underline:hover {
            color: var(--text-primary);
        }
        .animated-underline::after {
          content: '';
          position: absolute;
          width: 0;
          height: 2px;
          bottom: 0;
          left: 50%;
          transform: translateX(-50%);
          background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary)); /* Gradient underline */
          transition: width var(--transition-duration) var(--transition-easing);
        }
        .animated-underline:hover::after, .animated-underline:focus::after {
          width: 100%;
        }
        
        .section-title { /* For general section titles */
            font-family: var(--font-heading);
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-primary);
        }
        .section-subtitle { /* For subtitles under main section titles */
            font-family: var(--font-body);
            color: var(--text-secondary);
            font-size: 1.125rem; /* 18px */
            max-width: 38rem; /* Consistent max width for subtitles */
            margin-left: auto;
            margin-right: auto;
        }
        .section-title-accent {
            color: var(--accent-primary);
            font-weight: 600; 
        }

        .icon-wrapper {
            border-radius: 0.5rem; 
            transition: transform var(--transition-duration) var(--transition-easing), 
                        box-shadow var(--transition-duration) var(--transition-easing);
            color: var(--text-on-accent); 
        }
        .icon-wrapper.bg-warning { 
             color: var(--text-primary); 
        }
        
        .risk-meter {
            background-color: var(--border-color-soft);
            height: 0.5rem; 
            border-radius: 0.25rem;
            position: relative;
            overflow: hidden;
        }
        .risk-meter::before { 
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--success) 0%, var(--warning) 50%, var(--danger) 100%);
            border-radius: inherit;
        }
        .risk-indicator-pointer {
            width: 16px;
            height: 16px;
            border-radius: 3px; 
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            background-color: var(--surface-bg); 
            border: 2px solid var(--text-primary); 
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
            transition: left var(--transition-duration) var(--transition-easing), 
                        background-color var(--transition-duration) var(--transition-easing);
            z-index: 1;
        }

        @keyframes scan-line-smooth {
            0% { transform: translateY(-100%) scaleX(1.5); opacity: 0.5; }
            50% { opacity: 0.2; }
            100% { transform: translateY(100%) scaleX(1.5); opacity: 0; }
        }
        .file-drop-area {
            border: 2px dashed var(--border-color-strong);
            border-radius: 0.5rem;
            padding: 2.5rem;
            text-align: center;
            cursor: pointer;
            background-color: var(--surface-bg);
            transition: border-color var(--transition-duration) var(--transition-easing), 
                        background-color var(--transition-duration) var(--transition-easing), 
                        box-shadow var(--transition-duration) var(--transition-easing);
            position: relative;
            overflow: hidden;
        }
        .file-drop-area.active, .file-drop-area:hover {
            border-color: var(--accent-primary);
            background-color: var(--accent-primary-light);
            box-shadow: 0 0 15px var(--accent-primary-glow);
        }
        .file-drop-area.active::before, .file-drop-area:hover::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px; 
            background: var(--accent-primary);
            animation: scan-line-smooth 1.5s linear infinite; /* Smoother animation */
        }
        .file-drop-area input[type="file"] { display: none; }

        .progress-bar-container {
            background-color: var(--border-color-soft);
            border-radius: 0.25rem;
            height: 0.75rem;
            padding: 2px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
        }
        .progress-bar {
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            transition: width var(--transition-duration) var(--transition-easing);
            height: 100%; 
            border-radius: 0.125rem;
        }
        
        .floating { animation: float-light 5s ease-in-out infinite alternate; }
        @keyframes float-light {
            0% { transform: translateY(0px) rotate(-1deg); }
            100% { transform: translateY(-10px) rotate(1deg); }
        }
        
        .shadow-accent-primary-glow { 
            box-shadow: 0 0 20px var(--accent-primary-glow);
        }
        .glow { 
            box-shadow: 0 0 15px var(--accent-primary-glow), 0 0 25px var(--accent-primary-glow);
        }
        .pricing-card-popular.card { 
             border-color: var(--accent-primary) !important;
             box-shadow: 0 10px 25px var(--accent-primary-glow), var(--shadow-lg);
        }


        .demo-tab {
            padding: 0.8rem 1.2rem; 
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 500;
            font-family: var(--font-heading);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px; 
            transition: color var(--transition-duration) var(--transition-easing), 
                        border-color var(--transition-duration) var(--transition-easing), 
                        background-color var(--transition-duration) var(--transition-easing);
            white-space: nowrap;
            border-top-left-radius: 0.375rem;
            border-top-right-radius: 0.375rem;
        }
        .demo-tab:hover:not(:disabled) {
            color: var(--accent-primary);
            background-color: var(--accent-primary-light);
        }
        .demo-tab.active {
            color: var(--accent-primary);
            border-bottom-color: var(--accent-primary);
            background-color: var(--surface-bg); 
            font-weight: 600;
        }
        .demo-tab.active::after { /* Active tab underline gradient */
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            bottom: -2px; /* Position it over the border-bottom */
            left: 0;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            animation: shimmerGradient 3s linear infinite;
        }
        @keyframes shimmerGradient {
            0% { background-position: -100% 0; }
            100% { background-position: 100% 0; }
        }
        .demo-tab:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: transparent !important;
        }
        
        .tab-content { display: none; }
        .tab-content.active {
            display: block;
            animation: fadeIn-light 0.5s var(--transition-easing);
            background-color: var(--surface-bg); 
        }
        @keyframes fadeIn-light {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sample-doc.card { 
            transition: transform var(--transition-duration) var(--transition-easing), 
                        box-shadow var(--transition-duration) var(--transition-easing), 
                        border-color var(--transition-duration) var(--transition-easing);
        }
        .sample-doc.card:hover:not(:disabled) {
            transform: translateY(-5px) scale(1.02);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent-primary);
        }
        .sample-doc.card:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: var(--shadow-md); 
            border-color: var(--border-color-soft); 
        }

        .document-viewer, .analysis-results {
            min-height: 28rem; 
            background-color: var(--body-bg); 
        }
        /* Results emphasis animation */
        .results-loaded .risk-summary, .results-loaded .clause-analysis {
            animation: resultFadeIn 0.5s var(--transition-easing) forwards;
        }
        @keyframes resultFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .risk-score-value-animated { /* For the number itself */
            transition: color 0.5s ease; /* Transition color change */
            animation: scoreUpdateAnim 0.5s ease-out;
        }
        @keyframes scoreUpdateAnim {
            0% { transform: scale(0.9); opacity: 0.5; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }


        textarea, input[type="text"], input[type="url"] {
            background-color: var(--surface-bg) !important;
            border: 1px solid var(--border-color-strong) !important;
            color: var(--text-primary) !important;
            border-radius: 0.375rem !important;
            padding: 0.8rem 1rem !important; 
            width: 100%; 
            transition: border-color var(--transition-duration) ease, box-shadow var(--transition-duration) ease;
        }
        textarea:focus, input[type="text"]:focus, input[type="url"]:focus {
            border-color: var(--accent-primary) !important;
            outline: none !important;
            box-shadow: 0 0 0 3px var(--accent-primary-glow) !important;
        }
        textarea:disabled, input[type="text"]:disabled, input[type="url"]:disabled {
            opacity: 0.7;
            background-color: var(--section-bg-alt) !important; 
            cursor: not-allowed;
        }
        
        #url-panel .flex input[type="text"] {
            border-top-right-radius: 0 !important;
            border-bottom-right-radius: 0 !important;
            border-right-width: 0 !important; 
            flex-grow: 1;
        }
        #url-panel .flex button {
            border-top-left-radius: 0 !important;
            border-bottom-left-radius: 0 !important;
        }

        ::placeholder {
            color: var(--text-muted) !important;
            opacity: 1;
        }
        
        /* Prose styles for light theme */
        .prose { color: var(--text-secondary); line-height: 1.7; }
        .prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 { color: var(--text-primary); margin-top: 1.4em; margin-bottom: 0.5em; font-weight: 600; font-family: var(--font-heading); }

        @keyframes blob-organic { /* More continuous and subtle blob animation */
            0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 50% 60%; transform: rotate(0deg) scale(1.0) translate(0px, 0px); opacity: 0.35; }
            12% { border-radius: 50% 50% 60% 40% / 50% 40% 60% 50%; transform: rotate(2deg) scale(1.02) translate(5px, -8px); opacity: 0.4; }
            25% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: rotate(-1deg) scale(1.05) translate(-3px, 5px); opacity: 0.45; }
            37% { border-radius: 70% 30% 50% 50% / 40% 60% 30% 70%; transform: rotate(3deg) scale(1.0) translate(8px, -4px); opacity: 0.4; }
            50% { border-radius: 60% 40% 70% 30% / 50% 60% 40% 50%; transform: rotate(-2deg) scale(1.03) translate(-6px, 6px); opacity: 0.35; }
            62% { border-radius: 50% 50% 30% 70% / 60% 40% 60% 40%; transform: rotate(1deg) scale(0.98) translate(3px, -7px); opacity: 0.4; }
            75% { border-radius: 40% 60% 70% 30% / 70% 30% 50% 50%; transform: rotate(-3deg) scale(1.02) translate(-5px, 3px); opacity: 0.45; }
            87% { border-radius: 30% 70% 40% 60% / 50% 70% 30% 50%; transform: rotate(2deg) scale(0.99) translate(6px, -5px); opacity: 0.38; }
        }
        .animate-blob {
          animation: blob-organic 25s infinite cubic-bezier(0.65, 0.05, 0.36, 1) alternate; /* Added alternate */
        }
        .animation-delay-2000 { animation-delay: -4s; }
        .animation-delay-4000 { animation-delay: -8s; }
        
        /* How It Works - Step Indicators & Arrows */
        .step-indicator {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            box-shadow: 0 4px 15px rgba(0,123,255,0.25);
            transition: transform var(--transition-duration) var(--transition-easing), box-shadow var(--transition-duration) var(--transition-easing);
        }
        .step-indicator:hover {

        .connecting-arrow { /* For fa-angles-right / fa-angles-down */

        @keyframes ping-slow-vertical-refined {
             0%, 100% { transform: translateY(0); opacity: 0.7; }
            50% { transform: translateY(8px); opacity: 0.4; }
        }
        .animate-ping-slow.fa-angles-right { animation: ping-slow-horizontal-refined 2.5s infinite ease-in-out; }
